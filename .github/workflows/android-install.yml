name: Android normal application install

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android-install.yml"
      - "android/**"
      - "assets/**"
      - "lib/**"
      - "pubspec.lock"
      - "pubspec.yaml"
      - "tools/android_install/**"
      - "tools/android_native_ui/**"
      - "tools/incoming_media_runtime/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-install.yml"
      - "android/**"
      - "assets/**"
      - "lib/**"
      - "pubspec.lock"
      - "pubspec.yaml"
      - "tools/android_install/**"
      - "tools/android_native_ui/**"
      - "tools/incoming_media_runtime/**"

permissions:
  contents: read

concurrency:
  group: android-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normal-app:
    name: Normal ${{ matrix.build-mode }} APK clean install (API ${{ matrix.api-level }} x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debug-test-store
            api-level: 35
            build-mode: debug
            apk-source: build/app/outputs/flutter-apk/app-debug.apk
            apk-name: meowwatch-debug-test-store.apk
          - variant: release-no-billing
            api-level: 35
            build-mode: release
            apk-source: build/app/outputs/flutter-apk/app-release.apk
            apk-name: meowwatch-debug-key-release.apk
          - variant: debug-test-store-api29
            api-level: 29
            build-mode: debug
            apk-source: build/app/outputs/flutter-apk/app-debug.apk
            apk-name: meowwatch-debug-test-store.apk

    steps:
      - name: Check out clean repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Flutter 3.44.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
          pub-cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare recording verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Check install runner contracts
        run: |
          python3 -m unittest tools.android_install.test_runner
          python3 -m unittest discover -s tools/incoming_media_runtime -p 'test_*.py'
          python3 -m tools.android_install.runner --help

      - name: Build normal ${{ matrix.build-mode }} application
        run: |
          if [[ "${{ matrix.build-mode }}" == debug ]]; then
            flutter build apk --debug --target=lib/main.dart
          else
            flutter build apk --release \
              --target=lib/main.dart \
              --dart-define=REVENUECAT_API_KEY=
          fi

      - name: Build independent native accessibility observer
        run: python3 -m tools.android_native_ui.build --platform 35 --build-tools 36.0.0

      - name: Package installable ${{ matrix.build-mode }} artifact
        run: |
          mkdir -p build/android-install-package
          packaged_apk="build/android-install-package/${{ matrix.apk-name }}"
          cp "${{ matrix.apk-source }}" "$packaged_apk"
          sha256sum "$packaged_apk" > "$packaged_apk.sha256"
          if [[ "${{ matrix.build-mode }}" == debug ]]; then
            cat > build/android-install-package/BOUNDARY.txt <<'EOF'
          Debug-mode normal lib/main.dart APK signed with the Android debug key.
          Uses the public RevenueCat Test Store SDK key selected by the debug build.
          Test Store purchases are sandbox behavior and cannot charge a payment method.
          Installable judging evidence only; not Play production-signed.
          EOF
          else
            cat > build/android-install-package/BOUNDARY.txt <<'EOF'
          Release-mode normal lib/main.dart APK signed with the Android debug key.
          RevenueCat is disabled because Test Store keys cannot run in release builds.
          Purchase behavior is covered by the debug Test Store artifact and runtime.
          Installable test evidence only; not Play production-signed.
          EOF
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Clean-install and launch the normal application
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            python3 -m tools.android_install.runner --serial emulator-5554 --build-mode ${{ matrix.build-mode }} --apk build/android-install-package/${{ matrix.apk-name }}
            python3 -m tools.incoming_media_runtime.run --serial emulator-5554 --apk build/android-install-package/${{ matrix.apk-name }}

      - name: Upload installable APK and native install evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: android-normal-${{ matrix.variant }}-install-${{ github.run_attempt }}
          path: |
            build/android-install-package/
            build/android-install-artifacts/
            build/incoming-media-runtime-artifacts/
          if-no-files-found: warn
          retention-days: 14
