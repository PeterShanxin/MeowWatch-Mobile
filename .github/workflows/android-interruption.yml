name: Android foreground audio-focus interruption

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-interruption.yml'
      - 'android/**'
      - 'lib/**'
      - 'pubspec.*'
      - 'tools/android_interruption_runtime/**'
      - 'tools/android_lifecycle_runtime/**'
      - 'tools/android_native_ui/**'
      - 'tools/android_install/**'
      - 'tools/incoming_media_runtime/**'
      - 'tools/android_multi_device/*fixture*'

permissions:
  contents: read

concurrency:
  group: android-interruption-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audio-focus:
    name: Permanent and transient audio focus recovery (API 35)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      INTERRUPTION_AVD_NAME: meowwatch_interruption_${{ github.run_id }}_${{ github.run_attempt }}
      PHONE_ACCEPTANCE_AVD_NAME: meowwatch_interruption_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Check interruption evidence contracts
        run: |
          python3 -m unittest tools.android_interruption_runtime.test_run tools.android_lifecycle_runtime.test_prepare_avd -v
          python3 -m tools.android_interruption_runtime.run --help
          bash -n tools/android_interruption_runtime/ci.sh
      - name: Prepare reviewed media for both focus cases
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          bash tools/android_multi_device/prepare_fixture.sh --output build/android-interruption-fixture --seconds 180
      - name: Build normal release application
        run: >-
          flutter build apk --release --target=lib/main.dart
          --dart-define=REVENUECAT_API_KEY=
      - name: Build independent native helpers
        run: |
          python3 -m tools.android_native_ui.build --platform 35 --build-tools 36.0.0
          python3 -m tools.android_interruption_runtime.build_helper --platform 35 --build-tools 36.0.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run foreground audio focus acceptance
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: ${{ env.INTERRUPTION_AVD_NAME }}
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          pre-emulator-launch-script: python3 -m tools.android_lifecycle_runtime.prepare_avd
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/android_interruption_runtime/ci.sh
      - name: Upload original interruption evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: android-foreground-audio-focus-${{ github.run_attempt }}
          path: |
            build/android-interruption-artifacts/
            build/android-phone-acceptance-avd/
            build/android-interruption-server/
            build/android-interruption-fixture/*.json
            build/android-interruption-fixture/*.sha256
            build/android-interruption-helper/build.json
            build/android-interruption-helper/*.log
            build/android-native-ui/build.json
            build/android-native-ui/manifest.log
            build/android-native-ui/verify.log
          if-no-files-found: warn
          retention-days: 14
