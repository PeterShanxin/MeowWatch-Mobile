name: Android runtime playback

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android-runtime.yml"
      - "android/**"
      - "integration_test/**"
      - "lib/core/media/**"
      - "lib/core/playback/**"
      - "pubspec.lock"
      - "pubspec.yaml"
      - "test_driver/**"
      - "tools/android_runtime/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-runtime.yml"
      - "android/**"
      - "integration_test/**"
      - "lib/core/media/**"
      - "lib/core/playback/**"
      - "pubspec.lock"
      - "pubspec.yaml"
      - "test_driver/**"
      - "tools/android_runtime/**"

permissions:
  contents: read

concurrency:
  group: android-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playback-smoke:
    name: Playback smoke (API 35 x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Flutter 3.44.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
          pub-cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check runtime test sources
        run: |
          dart format --output=none --set-exit-if-changed integration_test test_driver
          flutter analyze integration_test test_driver

      - name: Build playback smoke APK
        run: flutter build apk --debug --target=integration_test/playback_smoke_test.dart

      - name: Prepare artifact directory
        run: mkdir -p build/android-runtime-artifacts

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run real Android playback smoke
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/android_runtime/playback-smoke.sh

      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: android-runtime-playback-${{ github.run_attempt }}
          path: build/android-runtime-artifacts/
          if-no-files-found: warn
          retention-days: 14
