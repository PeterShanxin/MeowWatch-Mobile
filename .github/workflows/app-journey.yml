name: Android product journey

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/app-journey.yml'
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.*'
      - 'integration_test/app_journey_test.dart'
      - 'test_driver/app_journey_driver.dart'
      - 'tools/app_journey/**'
      - 'tools/android_multi_device/*fixture*'

permissions:
  contents: read

concurrency:
  group: app-journey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journey:
    name: Clean-install five phone and tablet viewports
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.0'
          cache: true
          pub-cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Prepare licensed media fixture
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          bash tools/android_multi_device/prepare_fixture.sh
      - name: Build production-app journey APK
        run: >-
          flutter build apk --debug --target=integration_test/app_journey_test.dart
          --dart-define=APP_JOURNEY_VIDEO_URL=http://10.0.2.2:18765/sync-fixture.mp4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record clean product journeys on Android
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/app_journey/ci.sh
      - name: Upload actual product screenshots and recordings
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: android-product-journey-${{ github.run_attempt }}
          path: |
            build/app-journey-artifacts/
            build/app-journey-runner/
            build/app-journey-fixture-server/
          retention-days: 14
