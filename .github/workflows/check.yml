name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver tools/native_capture tools/flutter_compat
      - run: flutter analyze --no-pub
      - run: python3 tools/ci/nearby_test_interface.py
      - run: flutter test --no-pub --reporter expanded

  nearby:
    name: Nearby package contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.0'
          cache: true
      - run: python3 tools/ci/nearby_test_interface.py
      - name: Verify pure Dart TLS transport
        working-directory: packages/nearby_bridge
        run: |
          dart pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          dart analyze --fatal-infos
          dart test --reporter expanded
      - name: Verify protected storage and discovery contracts
        working-directory: packages/nearby_platform
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
      - name: Verify native billing automation
        run: |
          python3 -m unittest discover -s tools/billing_runtime -p 'test_*.py'
          python3 -m unittest discover -s tools/hosting_purchase -p 'test_*.py'
          python3 -m unittest discover -s tools/nearby_runtime -p 'test_*.py'
          python3 -m unittest discover -s tools/android_multi_device -p 'test_*.py'
          python3 -m unittest discover -s tools/local_file_runtime -p 'test_*.py'
          python3 -m unittest discover -s tools/android_install -p 'test_*.py'
          python3 -m unittest discover -s tools/app_journey -p 'test_*.py'
          python3 -m unittest discover -s tools/production_together -p 'test_*.py'
          python3 -m unittest discover -s tools/flutter_compat -p 'test_*.py'
          python3 -m unittest discover -s tools/android_lifecycle_runtime -p 'test_*.py'
          python3 -m unittest tools.android_native_ui.test_observer
          python3 -m unittest discover -s tools/production_purchase_runtime -p 'test_*.py'
          python3 -m unittest discover -s tools/incoming_media_runtime -p 'test_*.py'
          bash tools/android_runtime/test_playback_smoke.sh
          bash tools/android_multi_device/test_record_two_devices.sh

  demo:
    name: Submission media contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install native video tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Verify pinned footage and render a labeled synthetic smoke clip
        run: python3 -m unittest tools.submission_demo.test_compose -v
