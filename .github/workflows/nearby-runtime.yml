name: Android Nearby runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/nearby-runtime.yml"
      - "android/**"
      - "integration_test/nearby_platform_smoke_test.dart"
      - "lib/core/nearby/android_lan.dart"
      - "packages/nearby_bridge/**"
      - "packages/nearby_platform/**"
      - "pubspec.lock"
      - "pubspec.yaml"
      - "test_driver/nearby_platform_driver.dart"
      - "tools/nearby_runtime/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/nearby-runtime.yml"
      - "android/**"
      - "integration_test/nearby_platform_smoke_test.dart"
      - "lib/core/nearby/android_lan.dart"
      - "packages/nearby_bridge/**"
      - "packages/nearby_platform/**"
      - "pubspec.lock"
      - "pubspec.yaml"
      - "test_driver/nearby_platform_driver.dart"
      - "tools/nearby_runtime/**"

permissions:
  contents: read

concurrency:
  group: nearby-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nearby-platform-smoke:
    name: Protected store, LAN and NSD (API 35 x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Flutter 3.44.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
          pub-cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check runtime gate sources
        run: |
          dart format --output=none --set-exit-if-changed \
            integration_test/nearby_platform_smoke_test.dart \
            test_driver/nearby_platform_driver.dart
          flutter analyze \
            integration_test/nearby_platform_smoke_test.dart \
            test_driver/nearby_platform_driver.dart
          python3 -m unittest tools.nearby_runtime.test_run

      - name: Build Nearby platform smoke APK
        run: >-
          flutter build apk --debug --no-pub
          --target=integration_test/nearby_platform_smoke_test.dart

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run three retained-install Android processes
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: >-
            python3 tools/nearby_runtime/run.py
            --serial emulator-5554
            --apk build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload bounded Nearby runtime evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: android-nearby-runtime-${{ github.run_attempt }}
          path: build/nearby-runtime-artifacts/
          if-no-files-found: warn
          retention-days: 14
