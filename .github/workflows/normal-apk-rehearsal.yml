name: Normal APK clean-install rehearsal

on:
  workflow_dispatch:
  push:
    branches: [feat/submission-showcase]
    paths:
      - '.github/workflows/normal-apk-rehearsal.yml'
      - 'tools/normal_apk_rehearsal/**'

permissions:
  contents: read

concurrency:
  group: normal-apk-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rehearsal:
    name: One ordinary APK on fresh phone and tablet (API 35)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Check rehearsal source
        run: |
          python3 -m unittest tools.normal_apk_rehearsal.test_run -v
          bash -n tools/normal_apk_rehearsal/ci.sh
          python3 -m tools.normal_apk_rehearsal.run --help
      - name: Prepare API 35 image and hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          preparation="$GITHUB_WORKSPACE/build/android-multi-device/sdk-preparation"
          python3 -m tools.android_multi_device.prepare_sdk_packages prepare --sdk-root "$sdk_root" --output "$preparation"
          echo "MEOWWATCH_ANDROID_SDK_PREPARATION=$preparation/result.json" >> "$GITHUB_ENV"
      - name: Prepare controlled 90-second video
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          bash tools/android_multi_device/prepare_fixture.sh --seconds 90
      - name: Build one ordinary debug APK and independent UI observer
        run: |
          flutter build apk --debug --target-platform android-x64 --target lib/main.dart
          python3 -m tools.android_native_ui.build --platform 35 --build-tools 36.0.0
      - name: Rehearse visible application journey
        run: bash tools/normal_apk_rehearsal/ci.sh
      - name: Upload screenshots, hierarchies and result
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: normal-apk-rehearsal-${{ github.run_attempt }}
          path: |
            build/normal-apk-rehearsal/
            build/android-multi-device/sdk-preparation/
            build/android-multi-device/fixture/*.json
            build/android-multi-device/fixture/*.sha256
            build/android-native-ui/build.json
            !build/normal-apk-rehearsal/**/*.apk
          if-no-files-found: warn
          retention-days: 14
