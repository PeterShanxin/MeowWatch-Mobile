name: Repository secret audit

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the pinned official Gitleaks release
        run: |
          task_tmp="$RUNNER_TEMP/meowwatch-secret-audit"
          mkdir -p "$task_tmp/snapshot" "$task_tmp/empty-ignore"
          curl --fail --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$task_tmp/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$task_tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$task_tmp/gitleaks.tar.gz" -C "$task_tmp" gitleaks
          "$task_tmp/gitleaks" version
      - name: Scan the tracked snapshot and all fetched history
        run: |
          task_tmp="$RUNNER_TEMP/meowwatch-secret-audit"
          git archive HEAD | tar -x -C "$task_tmp/snapshot"
          printf '[extend]\nuseDefault = true\n' > "$task_tmp/default-rules.toml"
          common=(--redact=100 --no-banner --no-color --ignore-gitleaks-allow
            --config "$task_tmp/default-rules.toml" --gitleaks-ignore-path "$task_tmp/empty-ignore"
            --report-format json --timeout 120)
          snapshot_exit=0
          history_exit=0
          "$task_tmp/gitleaks" dir "$task_tmp/snapshot" "${common[@]}" \
            --report-path "$task_tmp/snapshot.json" || snapshot_exit=$?
          "$task_tmp/gitleaks" git . --log-opts='--all --full-history' "${common[@]}" \
            --report-path "$task_tmp/history.json" || history_exit=$?
          export AUDIT_SNAPSHOT_EXIT="$snapshot_exit" AUDIT_HISTORY_EXIT="$history_exit"
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          task_tmp = Path(os.environ['RUNNER_TEMP']) / 'meowwatch-secret-audit'
          git = lambda *args: subprocess.check_output(['git', *args]).decode().strip()
          paths = git('ls-files', '-z').split('\0')
          paths = [path for path in paths if path]
          pattern = re.compile(r'(?i)(^|/)(\.local|\.env(?:\..*)?|key\.properties|credentials)(/|$)|\.(log|pem|key|keystore|jks|mp4|webm|p12|pfx)$')
          # Curated, app-only submission clips; raw captures remain untracked.
          # Both snapshot and history still pass the full secret scanner below.
          published_media = {
              'showcase/remotion/source-media/physical-fullscreen-phone.mp4',
              'showcase/remotion/source-media/physical-local-phone.mp4',
          }
          suspicious = [path for path in paths if pattern.search(path) and path not in published_media]
          summary = {'head': git('rev-parse', 'HEAD'), 'gitleaksVersion': '8.30.1',
                     'trackedFileCount': len(paths), 'fetchedCommitCount': int(git('rev-list', '--all', '--count')),
                     'suspiciousTrackedPaths': suspicious, 'scans': {}}
          for name, env in [('snapshot', 'AUDIT_SNAPSHOT_EXIT'), ('history', 'AUDIT_HISTORY_EXIT')]:
              report = task_tmp / (name + '.json')
              findings = json.loads(report.read_text()) if report.exists() else None
              summary['scans'][name] = {'exitCode': int(os.environ[env]),
                                        'findingCount': len(findings) if findings is not None else None}
          output = Path('build/repository-audit')
          output.mkdir(parents=True, exist_ok=True)
          (output / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          # Publish counts only; never upload raw scanner findings.
          passed = not suspicious and all(v['exitCode'] == 0 and v['findingCount'] == 0
                                          for v in summary['scans'].values())
          raise SystemExit(0 if passed else 1)
          PY
      - name: Retain only the audit summary
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: repository-audit-${{ github.run_attempt }}
          path: build/repository-audit/summary.json
          retention-days: 14
