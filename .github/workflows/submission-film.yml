name: Render a reviewed submission edit on hosted CI

on:
  workflow_call:
    inputs:
      edit:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Check source provenance contracts
        run: python3 -m unittest tools.submission_demo.test_fetch_sources -v
      - name: Fetch exact successful native source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          EDIT_PATH: ${{ inputs.edit }}
        run: python3 tools/submission_demo/fetch_sources.py "$EDIT_PATH" build/submission-film
      - name: Install hosted video tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Render the complete pinned edit and verify its decode
        run: |
          python3 tools/submission_demo/compose.py render build/submission-film/edit.json build/submission-film/MeowWatch-Mobile-Review.mp4
          ffmpeg -nostdin -v error -xerror -err_detect explode -threads 2 -i build/submission-film/MeowWatch-Mobile-Review.mp4 -f null - 2> build/submission-film/decode.log
          mkdir -p build/submission-film/review-frames
          ffmpeg -nostdin -v error -threads 2 -i build/submission-film/MeowWatch-Mobile-Review.mp4 -vf fps=1/4 -threads 1 build/submission-film/review-frames/frame-%02d.png
      - name: Retain the beginning, midpoint and end of every edited shot
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path('build/submission-film')
          manifest = json.loads((root / 'MeowWatch-Mobile-Review.mp4.manifest.json').read_text())
          selected = []
          for shot in manifest['shots']:
              first = round(shot['output_in'] * 30)
              last = round(shot['output_out'] * 30) - 1
              for position, frame in [('start', first), ('middle', (first + last) // 2), ('end', last)]:
                  selected.append({'shot': shot['id'], 'position': position, 'frame': frame,
                                   'outputSeconds': frame / 30})
          assert len({entry['frame'] for entry in selected}) == len(selected)
          target = root / 'shot-review-frames'
          target.mkdir()
          expression = '+'.join('eq(n\\,' + str(entry['frame']) + ')' for entry in selected)
          subprocess.run(['ffmpeg', '-nostdin', '-v', 'error', '-xerror', '-threads', '2',
                          '-i', str(root / 'MeowWatch-Mobile-Review.mp4'), '-vf', 'select=' + expression,
                          '-fps_mode', 'passthrough', '-threads', '1', str(target / 'frame-%02d.png')],
                         check=True, timeout=180)
          images = sorted(target.glob('frame-*.png'))
          assert len(images) == len(selected)
          for entry, path in zip(selected, images):
              entry['file'] = path.name
              entry['sha256'] = hashlib.sha256(path.read_bytes()).hexdigest()
          (target / 'frames.json').write_text(json.dumps(selected, indent=2) + '\n')
          PY
      - name: Preserve review film and provenance
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: submission-film-review-${{ github.run_attempt }}
          path: |
            build/submission-film/MeowWatch-Mobile-Review.mp4*
            build/submission-film/edit*.json
            build/submission-film/source-runs.json
            build/submission-film/decode.log
            build/submission-film/review-frames/
            build/submission-film/shot-review-frames/
          retention-days: 14
