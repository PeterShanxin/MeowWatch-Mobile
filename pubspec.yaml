name: meowwatch_mobile
description: "Movie night, even when you are miles apart. Android-first synchronized playback and nearby companion."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  app_links: ^7.2.1
  crypto: ^3.0.7
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  meta: ^1.18.0
  path: ^1.9.1
  path_provider: ^2.1.6
  purchases_flutter: ^10.12.0
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  video_player: ^2.14.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay.ttf
